services:
  synaboot-api:
    build:
      context: ./apps/api
    environment:
      SERVER_IP: ${SERVER_IP:-192.168.1.168}
      SYNABOOT_DATA_DIR: /srv/synaboot/data
      SYNABOOT_CONFIG_DIR: /srv/synaboot/config
      SYNABOOT_PORT: ${SYNABOOT_HTTP_PORT:-18080}
      SYNABOOT_ADMIN_TOKEN: ${SYNABOOT_ADMIN_TOKEN:-}
      SYNABOOT_NFS_SERVER: ${SYNABOOT_NFS_SERVER:-${SERVER_IP:-192.168.1.168}}
    volumes:
      - ./data:/srv/synaboot/data
      - ./config:/srv/synaboot/config:ro
    expose:
      - "8000"
    restart: unless-stopped

  synaboot-nginx:
    build:
      context: ./apps/web
    depends_on:
      - synaboot-api
    ports:
      - "${SYNABOOT_HTTP_BIND:-18080}:8080/tcp"
    volumes:
      - ./data/images:/srv/synaboot/data/images:ro
      - ./data/boot:/srv/synaboot/data/boot:ro
    restart: unless-stopped

  synaboot-worker:
    build:
      context: ./apps/worker
    depends_on:
      - synaboot-api
    environment:
      SYNABOOT_API_URL: http://synaboot-api:8000/api/images
      SYNABOOT_SCAN_URL: http://synaboot-api:8000/api/scan
      SYNABOOT_ADMIN_TOKEN: ${SYNABOOT_ADMIN_TOKEN:-}
      SCAN_INTERVAL_SECONDS: "300"
    restart: unless-stopped
