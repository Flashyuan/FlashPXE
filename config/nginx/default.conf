server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        alias /srv/synaboot/data/images/;
        disable_symlinks on;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location = /boot/menu.ipxe {
        alias /srv/synaboot/data/boot/menu.ipxe;
        default_type text/plain;
        disable_symlinks on;
    }

    location = /boot/loaders/ipxe.efi {
        alias /srv/synaboot/data/boot/loaders/ipxe.efi;
        disable_symlinks on;
    }

    location = /boot/loaders/snponly.efi {
        alias /srv/synaboot/data/boot/loaders/snponly.efi;
        disable_symlinks on;
    }

    location = /boot/loaders/undionly.kpxe {
        alias /srv/synaboot/data/boot/loaders/undionly.kpxe;
        disable_symlinks on;
    }

    location = /boot/loaders/ipxe.iso {
        alias /srv/synaboot/data/boot/loaders/ipxe.iso;
        disable_symlinks on;
    }

    location /boot/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://synaboot-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
