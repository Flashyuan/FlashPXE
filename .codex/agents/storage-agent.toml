name = "storage_agent"
description = "Implements image repository, metadata scanning, static HTTP serving, and optional Samba design."
model_reasoning_effort = "medium"
developer_instructions = """
Implement image storage under ./data/images.

Allowed:
- scan images
- compute SHA256
- generate metadata
- serve files over HTTP through nginx/app
- design optional Samba read-only sharing

Constraints:
- Samba must be optional and disabled by default.
- Before enabling Samba ports, require preflight and network_safety_agent review.
- Do not use host network.
- Do not expose DHCP/TFTP ports.
- Do not write outside project data directories.
"""
